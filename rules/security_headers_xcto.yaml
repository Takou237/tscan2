id: RULE-XCTO-NOTSET-001
name: "X-Content-Type-Options Header Missing"
category: security_misconfiguration
severity: medium
version: "1.0.0"
created_at: "2026-09-11"
updated_at: "2026-09-11"

description: >
  L'en-tête X-Content-Type-Options est absent de la réponse du serveur. Sans
  lui, le navigateur peut interpréter le type MIME d'une ressource de façon
  erronée (MIME sniffing) et exécuter du contenu inattendu. Parité OWASP ZAP
  10038.

detection:
  keywords:
    - x-content-type-options
    - mime-sniffing

validation:
  method: passive
  description: >
    Vérification passive de la présence de l'en-tête X-Content-Type-Options
    dans la réponse.

evidence_expected:
  - "En-tête X-Content-Type-Options absent"

recommendation: >
  Ajouter l'en-tête X-Content-Type-Options avec la valeur « nosniff » pour
  désactiver l'interprétation heuristique du type MIME par le navigateur.

references:
  - "https://owasp.org/www-project-secure-headers/"

checks: []

confidence:
  base_score: 0.6
  multi_source_bonus: 0.1