id: RULE-SSTI-001
name: "Injection de template serveur potentielle (SSTI)"
category: ssti
severity: high
version: "1.0.0"
created_at: "2026-09-02"
updated_at: "2026-09-02"

description: >
  Une charge de test bénigne (`{7*7}`) envoyée dans un paramètre est évaluée
  côté serveur et le résultat (49) est retranscrit dans la réponse : le
  moteur de template traite le paramètre comme du code, permettant
  l'exécution de code arbitraire.

detection:
  keywords:
    - ssti
    - template injection
    - server-side template injection

validation:
  method: active
  description: >
    Sonde GET bénigne (ES-03) : la charge est une expression arithmétique
    inoffensive `7*7`. Le constat n'est émis que si le résultat `49` apparaît
    isolé dans la réponse (un nombre isolé, pas dans du texte). Aucune action
    de lecture/écriture n'est effectuée.

evidence_expected:
  - "Résultat arithmétique évalué par le moteur de template réfléchi dans la réponse"

recommendation: >
  Ne jamais utiliser un moteur de template sur des entrées utilisateur non
  échappées ; séparer la logique du contenu 100% statique et désactiver
  l'évaluation d'expressions dans les templates non fiables.

references:
  - "https://portswigger.net/research/server-side-template-injection"
  - "https://owasp.org/www-community/attacks/Server_Side_Template_Injection"

checks: []

confidence:
  base_score: 0.8
  multi_source_bonus: 0.15
