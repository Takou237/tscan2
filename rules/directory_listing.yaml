id: RULE-LISTING-001
name: "Listing de répertoire exposé"
category: information_disclosure
severity: medium
version: "1.0.0"
created_at: "2026-08-19"
updated_at: "2026-08-19"

description: >
  Le serveur web retourne l'index d'un répertoire (page « Index of ») au
  lieu de refuser l'accès : la structure interne des fichiers et leurs noms
  deviennent publics, ce qui prépare d'autres attaques (fichiers de
  sauvegarde, fichiers d'installation laissés sur place).

detection:
  keywords:
    - directory listing
    - index of
    - information disclosure

validation:
  method: passive
  description: >
    Constat passif : la signature « Index of » (ou titre équivalent) est
    recherchée dans les pages HTML récupérées par le scan. Aucune requête
    supplémentaire.

evidence_expected:
  - "Page de listing de répertoire dans la réponse"

recommendation: >
  Désactiver l'indexation automatique des répertoires côté serveur web et
  livrer une page d'index explicite ou un refus 403 pour les dossiers.

references:
  - "https://owasp.org/www-project-top-ten/"

checks: []

confidence:
  base_score: 0.8
  multi_source_bonus: 0.2