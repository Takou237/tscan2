id: RULE-WEAK-AUTH-001
name: "Weak Authentication Method"
category: security_misconfiguration
severity: low
version: "1.0.0"
created_at: "2026-09-11"
updated_at: "2026-09-11"

description: >
  La ressource utilise le schéma d'authentification HTTP Basic : les
  identifiants transitent en clair (simple base64) et peuvent être capturés.
  Parité OWASP ZAP 10045.

detection:
  keywords:
    - weak authentication
    - basic auth
    - basic-authentication

validation:
  method: passive
  description: >
    Analyse passive des en-têtes des réponses : constat lorsque
    WWW-Authenticate déclare le schéma Basic. Aucune requête supplémentaire.

evidence_expected:
  - "En-tête WWW-Authenticate avec schéma Basic"

recommendation: >
  Remplacer Basic par une authentification forte et chiffrée (formulaire sur
  HTTPS, jeton), et ne jamais exposer Basic hors d'un tunnel TLS.

references:
  - "https://cwe.mitre.org/data/definitions/522.html"

checks: []

confidence:
  base_score: 0.5
  multi_source_bonus: 0.1