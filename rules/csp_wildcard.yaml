id: RULE-CSP-WILDCARD-001
name: "CSP: Wildcard Directive"
category: security_misconfiguration
severity: medium
version: "1.0.0"
created_at: "2026-09-02"
updated_at: "2026-09-02"

description: >
  La politique Content-Security-Policy contient des directives de source avec
  une source sauvage '*' (ou des directives de source non définies). Cela
  équivaut à autoriser n'importe quelle source pour la catégorie concernée,
  ce qui affaiblit sensiblement la protection. C'est l'alerte ZAP 10055.

detection:
  keywords:
    - content-security-policy
    - csp
    - wildcard
    - xss

validation:
  method: passive
  description: >
    Analyse passive du contenu de l'en-tête CSP : constat si une directive de
    source (script-src, style-src, img-src...) contient '*'.

evidence_expected:
  - "Directive de source CSP avec '*'"

recommendation: >
  Restreindre les directives de source à des origines concrètes (self,
  domaines explicitement de confiance) au lieu du wildcard '*'. Ajouter une
  directive default-src restrictive.

references:
  - "https://owasp.org/www-project-secure-headers/"

checks: []

confidence:
  base_score: 0.6
  multi_source_bonus: 0.1