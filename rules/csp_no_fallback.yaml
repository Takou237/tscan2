id: RULE-CSP-NO-FALLBACK-001
name: "CSP: Failure to Define Directive with No Fallback"
category: security_misconfiguration
severity: medium
version: "1.0.0"
created_at: "2026-09-02"
updated_at: "2026-09-02"

description: >
  La politique Content-Security-Policy ne définit pas au moins une directive
  sans fallback (form-action, base-uri, frame-ancestors...). Ces directives
  ne reportent pas vers default-src : les omettre revient à tout autoriser
  pour leur catégorie. C'est l'alerte ZAP 10055.

detection:
  keywords:
    - content-security-policy
    - csp
    - form-action
    - frame-ancestors

validation:
  method: passive
  description: >
    Analyse passive des directives de l'en-tête CSP : constat si une ou
    plusieurs directives sans fallback sont absentes.

evidence_expected:
  - "Directive(s) sans fallback non définie(s)"

recommendation: >
  Ajouter explicitement les directives sans fallback (form-action,
  base-uri, frame-ancestors...) à la politique CSP.

references:
  - "https://owasp.org/www-project-secure-headers/"

checks: []

confidence:
  base_score: 0.6
  multi_source_bonus: 0.1