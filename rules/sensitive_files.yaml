id: RULE-SENSITIVE-FILES-001
name: "Fichier sensible exposé"
category: information_disclosure
severity: high
version: "1.0.0"
created_at: "2026-08-19"
updated_at: "2026-08-19"

description: >
  Un fichier qui ne devrait jamais être accessible publiquement (fichier de
  configuration, sauvegarde, archive, dump de base) est servi par le serveur
  web (statut 200) avec un contenu caractéristique.

detection:
  keywords:
    - .git
    - env file
    - backup
    - sql dump
    - information disclosure

validation:
  method: active
  description: >
    Sondes GET bénignes sur une liste fermée de chemins sensibles connus
    (/.git/config, /.env, /backup.zip, /dump.sql, variantes de sauvegarde),
    associées à une signature de contenu par chemin pour éviter de signaler
    une simple page web renvoyée en 404 personnalisée.

evidence_expected:
  - "Statut 200 et contenu caractéristique du fichier exposé"

recommendation: >
  Retirer ces fichiers du document root, configurer le serveur web pour les
  refuser, et vérifier qu'aucune copie de sauvegarde ne traîne dans les
  dossiers servis.

references:
  - "https://owasp.org/Top10/A01_2021-Broken_Access_Control/"

checks: []

confidence:
  base_score: 0.8
  multi_source_bonus: 0.2