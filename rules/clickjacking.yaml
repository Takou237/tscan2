id: RULE-CLICKJACKING-001
name: "Cible intégrable dans une iframe (clickjacking possible)"
category: security_misconfiguration
severity: medium
version: "1.0.0"
created_at: "2026-08-19"
updated_at: "2026-08-19"

description: >
  La cible ne se protège pas contre l'intégration dans une iframe : aucun
  en-tête X-Frame-Options ni directive frame-ancestors de Content-Security-
  Policy. Un site tiers peut alors superposer des éléments trompeurs et
  amener un visiteur à déclencher des actions à son insu (clickjacking).

detection:
  keywords:
    - clickjacking
    - x-frame-options
    - frame-ancestors
    - iframe

validation:
  method: passive
  description: >
    Validation passive : l'absence de protections anti-intégration est
    directement observable dans les en-têtes de la réponse racine. Une
    confirmation active (chargement de la cible dans une iframe de test)
    est inutile ici : le constat découle des en-têtes eux-mêmes.

evidence_expected:
  - "En-têtes de la réponse racine (absence de X-Frame-Options et de CSP frame-ancestors)"

recommendation: >
  Ajouter l'en-tête X-Frame-Options: DENY (ou SAMEORIGIN selon l'usage),
  ou plus robuste, une politique Content-Security-Policy incluant
  frame-ancestors (ex: frame-ancestors 'self').

references:
  - "https://owasp.org/www-community/attacks/Clickjacking"

checks:
  - id: clickjacking
    type: clickjacking
    description: "Cible intégrable dans une iframe : aucun X-Frame-Options ni CSP frame-ancestors."

confidence:
  base_score: 0.75
  multi_source_bonus: 0.2
