id: RULE-MISCONFIG-001
name: "En-tête de sécurité HTTP manquant"
category: security_misconfiguration
severity: info
version: "1.0.0"
created_at: "2026-08-14"
updated_at: "2026-08-14"

description: >
  Un en-tête de sécurité HTTP recommandé (Content-Security-Policy,
  X-Frame-Options, Strict-Transport-Security...) est absent de la réponse du
  serveur. Ce n'est pas une vulnérabilité exploitable en soi, mais une
  faiblesse de configuration qui facilite d'autres attaques (Clickjacking,
  injection de contenu...).

detection:
  keywords:
    - misconfig
    - clickjacking
    - x-frame-options
    - security-headers
    - csp
    - content-security-policy
    - ssl
    - tls

validation:
  method: passive
  description: >
    Validation passive suffisante pour le MVP : l'absence d'un en-tête est
    directement vérifiable dans la réponse HTTP, sans nécessiter de
    confirmation active. Ce statut de validation "passive" concerne
    uniquement la vérification elle-même ; la reconnaissance active (envoi
    de la requête HTTP par le moteur Tscan) reste prévue au bloc scan actif
    (semaines 7-8) et n'est pas encore implémentée à ce stade.

evidence_expected:
  - "En-tête HTTP absent observé dans la réponse du serveur"

recommendation: >
  Ajouter l'en-tête HTTP manquant sur le serveur ou le reverse proxy
  concerné, avec une valeur adaptée au contexte de l'application (par
  exemple une politique Content-Security-Policy restrictive plutôt que
  permissive).

references:
  - "https://owasp.org/www-project-secure-headers/"

checks:
  # Checks déclaratifs (semaine 7b) : un résultat par en-tête manquant,
  # évalués par le moteur de scan sur la réponse racine, sans requête
  # supplémentaire. Les en-têtes de la liste sont ceux recommandés par
  # l'OWASP Secure Headers Project.
  - id: header-csp
    type: header_absent
    header: Content-Security-Policy
    description: "En-tête Content-Security-Policy absent : aucune restriction des sources de contenu."
  - id: header-x-frame-options
    type: header_absent
    header: X-Frame-Options
    description: "En-tête X-Frame-Options absent : l'intégration dans une iframe n'est pas contrôlée (voir aussi la règle clickjacking)."
  - id: header-hsts
    type: header_absent
    header: Strict-Transport-Security
    description: "En-tête Strict-Transport-Security absent : aucune politique de transport strict annoncée aux navigateurs."
  - id: header-content-type-options
    type: header_absent
    header: X-Content-Type-Options
    description: "En-tête X-Content-Type-Options absent : le sniffing de type MIME n'est pas désactivé."
  - id: header-referrer-policy
    type: header_absent
    header: Referrer-Policy
    description: "En-tête Referrer-Policy absent : la quantité d'informations transmise dans le Referer n'est pas bornée."
  - id: header-permissions-policy
    type: header_absent
    header: Permissions-Policy
    description: "En-tête Permissions-Policy absent : les capacités du navigateur (caméra, géolocalisation...) ne sont pas restreintes."

confidence:
  base_score: 0.6
  multi_source_bonus: 0.25
