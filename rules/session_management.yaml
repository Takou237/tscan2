id: RULE-SESSION-MGMT-001
name: "Session Management Response Identified"
category: security_misconfiguration
severity: info
version: "1.0.0"
created_at: "2026-09-11"
updated_at: "2026-09-11"

description: >
  Une réponse identifie un jeton de gestion de session (cookie de session,
  identifiant JSESSIONID/PHPSESSID...) : la protection de la session doit être
  revue (HttpOnly, Secure, SameSite). Parité OWASP ZAP 10112.

detection:
  keywords:
    - session management
    - gestion de session

validation:
  method: passive
  description: >
    Analyse passive des en-têtes Set-Cookie des réponses crawlées. Aucune
    requête supplémentaire.

evidence_expected:
  - "Jeton de session identifié"

recommendation: >
  Vérifier que les jetons de session sont protégés par défaut : drapeaux
  HttpOnly et Secure, attribute SameSite, rotation à l'authentification.

references:
  - "https://www.zaproxy.org/docs/alerts/10112/"

checks: []

confidence:
  base_score: 0.5
  multi_source_bonus: 0.1