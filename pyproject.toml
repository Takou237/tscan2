[project]
name = "tscan"
version = "0.1.0"
description = "Plateforme d'analyse, de corrélation et de validation de vulnérabilités de sécurité"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "httpx>=0.27",
    # Décompression des réponses Brotli : client.py annonce « br » dans
    # Accept-Encoding ; sans ce paquet, httpx renvoie un corps compressé
    # illisible et toutes les détections HTML passives échouent.
    "brotli>=1.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pyyaml>=6.0",
    "pyside6>=6.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    # ES-12 : contrôle des vulnérabilités des dépendances tierces (cf. script
    # `scripts/audit_deps.py` et la commande documentée dans le README).
    "pip-audit>=2.7",
]

[project.scripts]
tscan = "tscan_cli.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]
