# Table de référence CWE minimale (RF-33, chapitre 4).
#
# Contrairement à CVE/NVD et CISA KEV, CWE n'est pas synchronisé depuis le
# réseau : c'est une taxonomie de types de faiblesses (pas d'instances), qui
# ne sert dans Tscan qu'en métadonnée complémentaire sur les règles et les
# résultats, pas dans la logique de détection elle-même (celle-ci repose sur
# la taxonomie propre à Tscan définie dans tscan_core.finding_types).
#
# Ce fichier ne contient donc que le sous-ensemble de CWE directement
# pertinent pour les cinq familles du MVP, pas la taxonomie complète du
# MITRE (plusieurs centaines d'entrées, dont l'essentiel serait sans usage
# ici). Il peut être étendu librement sans toucher au code.

